<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alahama 3D Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #fff;
      font-family: sans-serif;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 12px;
      border-radius: 8px;
      z-index: 10;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">WASD: Mover | ESPAÇO / E: Usar Picareta | Clique Esquerdo: Quebrar Bloco | Clique Direito: Criar Bloco</div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. CONFIGURAÇÃO DA CENA E CÂMERA
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x00e5ff);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 6, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Iluminação
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 5);
    scene.add(light);

    // CARREGAR MODELO 3D (ALAHAMA.GLB)
    const loader = new GLTFLoader();
    loader.load(
      './alahama.glb',
      (gltf) => {
        const model = gltf.scene;
        model.position.set(0, 0, 0);
        model.scale.set(1, 1, 1);
        scene.add(model);
      },
      undefined,
      (error) => {
        console.error('Erro ao carregar o modelo 3D:', error);
      }
    );

    // 2. SISTEMA DE BLOCOS INTERATIVOS (SANDBOX)
    const blocosInterativos = [];

    function criarBloco(x, y, z, cor, comGrama = false) {
      const geo = new THREE.BoxGeometry(1, 1, 1);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        pos.setX(i, pos.getX(i) + (Math.random() - 0.5) * 0.05);
        pos.setY(i, pos.getY(i) + (Math.random() - 0.5) * 0.05);
      }

      const bloco = new THREE.Mesh(geo, new THREE.MeshToonMaterial({ color: cor }));
      bloco.position.set(x, y, z);

      if (comGrama) {
        const grama = new THREE.Mesh(new THREE.BoxGeometry(1, 0.2, 1), new THREE.MeshToonMaterial({ color: 0x00ff00 }));
        grama.position.y = 0.55;
        bloco.add(grama);
      }

      scene.add(bloco);
      blocosInterativos.push(bloco);
      return bloco;
    }

    // Gerar Chão
    for (let x = -8; x <= 8; x++) {
      for (let z = -4; z <= 4; z++) {
        criarBloco(x, -0.5, z, 0x8B4513, true);
      }
    }

    // 3. JOGADOR (ALAHAMA) COM PICARETA
    const alahamaGroup = new THREE.Group();
    const corpoGeo = new THREE.SphereGeometry(0.7, 32, 32);
    const alahamaCorpo = new THREE.Mesh(corpoGeo, new THREE.MeshToonMaterial({ color: 0x60a5fa }));
    alahamaGroup.add(alahamaCorpo);

    // Criar Picareta
    const pickaxeGroup = new THREE.Group();
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.0, 8), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
    handle.position.y = 0.5;
    pickaxeGroup.add(handle);

    const pickHead = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.12), new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 }));
    pickHead.position.y = 1.0;
    pickaxeGroup.add(pickHead);

    pickaxeGroup.position.set(0.6, 0.1, 0);
    pickaxeGroup.rotation.z = Math.PI / 4;
    alahamaGroup.add(pickaxeGroup);

    alahamaGroup.position.set(0, 0.7, 0);
    scene.add(alahamaGroup);

    // 4. INIMIGOS E PERSONAGENS (CHARLIE E ZOMBI MJ)
    function createBox(w, h, d, cor, x, y, z) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: cor }));
      m.position.set(x, y, z);
      return m;
    }

    // Zombie MJ
    const zombieGroup = new THREE.Group();
    zombieGroup.add(createBox(0.4, 0.4, 0.4, 0xe8c4a8, 0, 1.6, 0));
    zombieGroup.add(createBox(0.7, 0.8, 0.4, 0x3b82f6, 0, 1.0, 0));
    zombieGroup.add(createBox(0.25, 0.8, 0.25, 0x1e3a8a, -0.18, 0.2, 0));
    zombieGroup.add(createBox(0.25, 0.8, 0.25, 0x1e3a8a, 0.18, 0.2, 0));
    zombieGroup.position.set(4, 0.2, -2);
    scene.add(zombieGroup);

    // Charlie (Steve)
    const charlieGroup = new THREE.Group();
    charlieGroup.add(createBox(0.4, 0.4, 0.4, 0xe8c4a8, 0, 1.7, 0));
    charlieGroup.add(createBox(0.5, 0.6, 0.25, 0xff0000, 0, 1.2, 0));
    charlieGroup.add(createBox(0.2, 0.6, 0.2, 0x00aa00, -0.125, 0.6, 0));
    charlieGroup.add(createBox(0.2, 0.6, 0.2, 0x00aa00, 0.125, 0.6, 0));
    charlieGroup.position.set(-3, 0.2, 2);
    scene.add(charlieGroup);

    // 5. CONTROLES DO TECLADO E MOUSE
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersecoes = raycaster.intersectObjects(blocosInterativos);
      if (intersecoes.length > 0) {
        const hit = intersecoes[0];
        if (event.button === 0) {
          scene.remove(hit.object);
          const idx = blocosInterativos.indexOf(hit.object);
          if (idx > -1) blocosInterativos.splice(idx, 1);
        } else if (event.button === 2) {
          const pos = hit.object.position.clone().add(hit.face.normal);
          criarBloco(pos.x, pos.y, pos.z, 0x8B4513);
        }
      }
    });
    window.addEventListener('contextmenu', e => e.preventDefault());

    // 6. LOOP PRINCIPAL DE ANIMAÇÃO E LÓGICA
    let isAttacking = false;

    function animate() {
      requestAnimationFrame(animate);

      // Movimento do Jogador
      if (keys['a'] || keys['arrowleft']) alahamaGroup.position.x -= 0.08;
      if (keys['d'] || keys['arrowright']) alahamaGroup.position.x += 0.08;
      if (keys['w'] || keys['arrowup']) alahamaGroup.position.z -= 0.08;
      if (keys['s'] || keys['arrowdown']) alahamaGroup.position.z += 0.08;

      // Perseguição do Zombie MJ
      const dx = alahamaGroup.position.x - zombieGroup.position.x;
      const dz = alahamaGroup.position.z - zombieGroup.position.z;
      const dist = Math.hypot(dx, dz) || 1;

      if (dist > 1.2) {
        zombieGroup.position.x += (dx / dist) * 0.025;
        zombieGroup.position.z += (dz / dist) * 0.025;
        zombieGroup.lookAt(alahamaGroup.position.x, zombieGroup.position.y, alahamaGroup.position.z);
      }

      // Perseguição do Charlie
      const cdx = alahamaGroup.position.x - charlieGroup.position.x;
      const cdz = alahamaGroup.position.z - charlieGroup.position.z;
      const cDist = Math.hypot(cdx, cdz) || 1;

      if (cDist > 2.0) {
        charlieGroup.position.x += (cdx / cDist) * 0.02;
        charlieGroup.position.z += (cdz / cDist) * 0.02;
        charlieGroup.lookAt(alahamaGroup.position.x, 0, alahamaGroup.position.z);
      }

      // Ataque de Picareta
      if ((keys[' '] || keys['e']) && !isAttacking) {
        isAttacking = true;
        let frameAnim = 0;
        const interval = setInterval(() => {
          frameAnim += 0.3;
          pickaxeGroup.rotation.z = Math.PI / 4 + Math.sin(frameAnim) * 1.5;

          if (dist < 1.8 && frameAnim > 1) {
            zombieGroup.position.x -= (dx / dist) * 0.4;
            zombieGroup.position.z -= (dz / dist) * 0.4;
          }

          if (frameAnim > Math.PI) {
            clearInterval(interval);
            pickaxeGroup.rotation.z = Math.PI / 4;
            isAttacking = false;
          }
        }, 16);
      }

      // Câmera segue o jogador
      camera.position.x = alahamaGroup.position.x;
      camera.position.z = alahamaGroup.position.z + 10;
      camera.lookAt(alahamaGroup.position);

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
